<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточки Bootstrap</title>
<link rel="stylesheet" href="../assets/bootstrap.min.css">
</head>
<body>
<main class="container py-5">
<a href="index.html">Формы и таблицы</a>
<h1 class="my-4">Карточки котов</h1>
<div class="row row-cols-1 row-cols-md-3 g-4 p-3 rounded" style="background:lightsalmon">
<div class="col">
<article class="card h-100">
<img src="img/cat0.jpg" class="card-img-top img-fluid" alt="Домашний кот">
<div class="card-body d-flex flex-column">
<h2 class="card-title h5">Домашний кот</h2>
<p class="card-text">Коты любят спокойствие, игры и уютные места для отдыха.</p>
<button class="btn btn-primary mt-auto align-self-start" data-bs-toggle="modal" data-bs-target="#requestModal">Подробнее</button>
</div>
</article>
</div>
<div class="col">
<article class="card h-100">
<img src="img/cat1.jpg" class="card-img-top img-fluid" alt="Два друга">
<div class="card-body d-flex flex-column">
<h2 class="card-title h5">Два друга</h2>
<p class="card-text">Общение и забота делают жизнь домашних животных лучше.</p>
<button class="btn btn-primary mt-auto align-self-start" data-bs-toggle="modal" data-bs-target="#requestModal">Подробнее</button>
</div>
</article>
</div>
<div class="col">
<article class="card h-100">
<img src="img/cat2.jpg" class="card-img-top img-fluid" alt="Дикая кошка">
<div class="card-body d-flex flex-column">
<h2 class="card-title h5">Дикая кошка</h2>
<p class="card-text">Леопард — один из самых ловких представителей кошачьих.</p>
<button class="btn btn-primary mt-auto align-self-start" data-bs-toggle="modal" data-bs-target="#requestModal">Подробнее</button>
</div>
</article>
</div>
</div>
</main>
<div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title fs-5" id="modalTitle">Вход в личный кабинет</h2>
<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть">
</button>
</div>
<div class="modal-body">
<form class="demo-form">
<label for="modalEmail" class="form-label">Email</label>
<input class="form-control mb-3" id="modalEmail" type="email" autocomplete="email" required>
<label for="modalPassword" class="form-label">Пароль</label>
<input class="form-control mb-3" id="modalPassword" type="password" minlength="8" autocomplete="current-password" required>
<button class="btn btn-primary">Войти</button>
<p class="form-result mt-3" role="status">
</p>
</form>
</div>
</div>
</div>
</div>
<script src="../assets/bootstrap.bundle.min.js">
</script>
<script src="../assets/forms.js">
</script>
</body>
</html>
